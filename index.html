<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jay 的个人 AI 站:知识库、提示词生成工具、每日 AI 资讯日报、作品展示与 AI 客服,部署在 Cloudflare Workers 上。"
    />
    <meta name="theme-color" content="#0b0f1e" />
    <script>
      // 首帧前设置主题,防闪烁:localStorage 优先,否则跟随系统深浅色
      (function () {
        var themes = ["nier", "aurora", "swiss", "terminal", "inkwarm", "bento", "brutal", "fighter", "cyberpunk", "arcade", "space", "aqua"];
        var t = null;
        try {
          t = localStorage.getItem("paih:theme");
        } catch (e) {}
        if (themes.indexOf(t) < 0) {
          t = "nier"; // 默认皮肤:机械纪元
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>Jay 的 AI 站</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
