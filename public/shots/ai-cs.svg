    <rect x="292" y="230" width="150" height="28" rx="14" fill="#ede9fe"/>
    <text x="312" y="249" fill="#6d28d9" font-size="12">意图:order_read</text>
    <rect x="452" y="230" width="120" height="28" rx="14" fill="#f1f5f9"/>
    <text x="470" y="249" fill="#64748b" font-size="12">RAG 命中 3 条</text>
