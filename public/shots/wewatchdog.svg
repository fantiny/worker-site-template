<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <!-- 窗口 -->
  <rect x="70" y="46" width="760" height="448" rx="12" fill="#0a0e14" stroke="#1f2a36"/>
  <rect x="70" y="46" width="760" height="36" rx="12" fill="#141c26"/>
  <circle cx="94" cy="64" r="6" fill="#ff5f57"/>
  <circle cx="114" cy="64" r="6" fill="#febc2e"/>
  <circle cx="134" cy="64" r="6" fill="#28c840"/>
  <text x="450" y="69" text-anchor="middle" fill="#8b98a9" font-family="Menlo, monospace" font-size="13">weWatchDog — 微信智能助理</text>

  <!-- 流水线 -->
  <g font-family="PingFang SC, sans-serif" font-size="14" text-anchor="middle">
    <rect x="110" y="108" width="140" height="40" rx="8" fill="#12202c" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="180" y="133" fill="#5eead4">屏幕感知</text>
    <path d="M254 128 h56" stroke="#3d4a5a" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="314" y="108" width="140" height="40" rx="8" fill="#12202c" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="384" y="133" fill="#5eead4">知识库检索</text>
    <path d="M458 128 h56" stroke="#3d4a5a" stroke-width="2"/>
    <rect x="518" y="108" width="140" height="40" rx="8" fill="#12202c" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="588" y="133" fill="#5eead4">LLM 生成回复</text>
    <path d="M662 128 h56" stroke="#3d4a5a" stroke-width="2"/>
    <rect x="722" y="108" width="80" height="40" rx="8" fill="#0f2a22" stroke="#34d399"/>
    <text x="762" y="133" fill="#34d399">自动发送</text>
  </g>

  <!-- 对话区 -->
  <g font-family="PingFang SC, sans-serif" font-size="15">
    <rect x="110" y="186" width="330" height="46" rx="10" fill="#1a2330"/>
    <text x="128" y="205" fill="#aebccb">客户:你们家的鲜食猫咪能吃吗?</text>
    <text x="128" y="224" fill="#5d6b7c" font-size="12">21:42 · 微信群「宠物家长交流群」</text>
    <rect x="460" y="250" width="370" height="66" rx="10" fill="#0f2a22" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="478" y="276" fill="#b7f5df">weWatchDog:可以的,猫狗配方都有。</text>
    <text x="478" y="298" fill="#b7f5df">猫款是鸡肉+南瓜,3 月龄以上可喂 🐱</text>
    <rect x="460" y="330" width="240" height="30" rx="8" fill="#101822" stroke="#26323e"/>
    <text x="476" y="350" fill="#64748b" font-size="12">来源:知识库 [产品介绍] · 置信 0.92</text>
  </g>

  <!-- 状态栏 -->
  <rect x="110" y="408" width="720" height="52" rx="10" fill="#0c1420"/>
  <circle cx="134" cy="434" r="6" fill="#34d399">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="152" y="439" fill="#8b98a9" font-family="Menlo, monospace" font-size="13">watching for new messages…  BM25 top-4  ·  3 级兜底 armed</text>
  <text x="760" y="439" fill="#3d4a5a" font-family="Menlo, monospace" font-size="12">macOS · 7×24</text>
</svg>
